        body {

            padding: 20px;
            font-family: 'Montserrat', sans-serif;
            color: #2a3533;
            background-color: #ffffff;
        }

        .banner {
            background: #c8d9ce;
            color: rgb(26, 23, 23);
            text-align: left;

            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .banner-text {

            padding: 30px 25px;
            border-radius: 10px;
            line-height: 1.8;
            font-size: 18px;
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo img {
            max-width: 250px;
            height: auto;
        }

        .tile {
            background-color: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tile:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .tile img {
            width: 70px;
            height: 70px;
            margin-bottom: 20px;
        }

        .tile-title {
            font-size: 22px;
            font-weight: bold;
            margin-top: 12px;
            color: #679791;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }
    </style>
</head>

    <script>

        async function verifyManagerAccess() {

            try {
                // Read URL userId
                const currentURL = window.location.href;
                const urlParams = new URLSearchParams(new URL(currentURL).search);
                const encodedUserId = urlParams.get("userId");

                console.log("User ID:", encodedUserId);

                if (!encodedUserId) {
                    console.warn("No userId found — hiding Print Estimate tile by default.");
                    document.getElementById("printEstimateTile").style.display = "none";
                    return;
                }

                // Call Scriptlet to check Sales Manager
                const response = await fetch(
                    "https://td3047046.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=95&deploy=1&compid=TD3047046&ns-at=AAEJ7tMQZfEmAHZ5pKgDlB14gl1ebwQScEBzoIyXL1pSYbQfpTM",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            action: "checkSalesManager",
                            userId: encodedUserId
                        })
                    }
                );

                const data = await response.json();
                console.log("Sales Manager Check Response:", data);


                console.log("Type of isSalesManager:", typeof data.isSalesManager);
                console.log("Value of isSalesManager:", data.isSalesManager);

                if (data.success && (data.isSalesManager === true || data.isSalesManager === "T" || data.isSalesManager === "true")) {
                    console.log("User is a Sales Manager");
                    document.getElementById("printEstimateTile").style.display = "block";
                }
                else {
                    console.log("User is NOT a Sales Manager");
                    document.getElementById("printEstimateTile").style.display = "none";
                }


            } catch (err) {
                console.error("Sales Manager Check Error:", err);
                document.getElementById("printEstimateTile").style.display = "none";
            }
        }

        // Run check when page loads
        document.addEventListener("DOMContentLoaded", verifyManagerAccess);

    </script>
