<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jobin & Jismi Reports Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      background-color: #f4f6f9;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: #0c2b24;
      height: 100vh;
      position: fixed;
      padding: 30px 20px;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sidebar img {
      max-width: 150px;
      margin-bottom: 30px;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 25px;
      text-align: center;
      color: #e0f7fa;
    }

    .sidebar a {
      display: block;
      color: #cfd8dc;
      padding: 12px 16px;
      margin-bottom: 10px;
      text-decoration: none;
      width: 100%;
      text-align: center;
      border-radius: 6px;
      transition: 0.3s;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #4e6e74;
      color: white;
    }

    /* Main Content */
    .main-content {
      margin-left: 260px;
      padding: 40px 50px;
      flex: 1;
    }

    .chart-section {
      background: white;
      margin-bottom: 60px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
    }

    .chart-section h2 {
      margin-top: 0;
      color: #333;
    }

    canvas {
      width: 100% !important;
      height: auto !important;
    }
  </style>

</head>

<body>

  <!-- Sidebar Navigation -->
  <div class="sidebar">
    <!-- ✅ Jobin & Jismi Logo -->
    <img
      src="https://td3031055.app.netsuite.com/core/media/media.nl?id=24006&c=TD3031055&h=stG7pnZIvWP14zsGeType7lw9JRDt4zl_rDh-ptqDLNCGq-Q"
      alt="Jobin & Jismi Logo" />
    <!-- <h2>📊 Reports</h2> -->
    <a href="#report1" class="active">Monthly Summary</a>
    <a href="#report2">Created vs Converted</a>
    <a href="#report3">Created per Customer</a>
  </div>

  <!-- Main Content Area -->
  <div class="main-content">

    <!-- Section 1 -->
    <div class="chart-section" id="report1">
      <h2>Sales Orders Created From Opportunities</h2>
      <canvas id="lineChart"></canvas>
    </div>

    <!-- Section 2 -->
    <div class="chart-section" id="report2">
      <h2>Total Hours (without Customers)</h2>
      <canvas id="barChart1"></canvas>
    </div>

    <!-- Section 3 -->
    <div class="chart-section" id="report3">
      <h2>Total Hours (with Customers)</h2>
      <canvas id="barChart2"></canvas>
    </div>

  </div>

  <!-- Chart Script -->
  <script>

    const BASE_URL = 'https://5742736.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=1024&deploy=1&compid=5742736&ns-at=AAEJ7tMQL9Tri5JLG_3XFKpOSabc7UkdR9r2XF1NZtmKg6MmUjY'
     const recordId = getCookie('recordId');
     console.log('Record ID from cookie:', recordId);
    fetch(`${BASE_URL}&action=fetchReportData`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ id: recordId})
    })
      .then(response => response.json())
      .then(data => {

        console.log(data);

        new Chart(document.getElementById('lineChart'), {
          type: 'line',
          data: {
            labels: data.monthlyOrders.labels,
            datasets: [{
              label: 'Sales Orders created from Opportunities',
              data: data.monthlyOrders.countData,
              borderColor: '#26a69a',
              backgroundColor: 'rgba(38,166,154,0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { position: 'top' } },
            scales: {
              y: { beginAtZero: true, title: { display: true, text: 'Count' } },
              x: { title: { display: true, text: 'Month/Year' } }
            }
          }
        });

        new Chart(document.getElementById('barChart1'), {
          type: 'bar',
          data: {
            labels: data.conversionSummary.yearData,
            datasets: [{
              label: 'Opportunities Created',
              data: data.conversionSummary.opportunityData,
              backgroundColor: ['#0c6c73']
            },
            {
              label: 'Opportunities Converted',
              data: data.conversionSummary.convertedData,
              backgroundColor: ['#abd334']
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { position: 'top' } },
            scales: {
              y: { beginAtZero: true, title: { display: true, text: 'Created vs Converted' } },
              x: { title: { display: true, text: 'Month/Year' } }
            }
          }
        });

        new Chart(document.getElementById('barChart2'), {
          type: 'bar',
          data: {
            labels: data.customerConversion.salesRepLabels,
            datasets: data.customerConversion.datasetStrings
          },
          options: {
            responsive: true,
            plugins: {
              title: {
                display: true,
                text: 'Converted Opportunities by Sales Rep and Customer'
              },
              legend: {
                display: false,
                position: 'top'
              }
            },
            scales: {
              x: {
                stacked: false,
                title: {
                  display: true,
                  text: 'Sales Rep'
                },
                barPercentage: 1.0,
                categoryPercentage: 1.0
              },
              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: 'Opportunity Count'
                }
              }
            }
          }
        });

      })
      .catch(error => console.log('Error sending email', error));

    const navLinks = document.querySelectorAll('.sidebar a');
    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        navLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? match[2] : null;
    }

</body>

</html>
