<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Opportunity Details</title>

    <style>
        body {
            font-family: "Montserrat", sans-serif;
        }

        .tab-content {
            display: none;
        }

        .tab-active {
            display: block;
        }
    </style>

</head>

<body class="bg-gray-100 min-h-screen">

    <div id="mainContent" class="w-full px-6 mt-10">
        <div
            class="relative flex flex-col min-w-0 break-words w-full mb-10 shadow-2xl bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl">

            <div class="border-t border-x border-[#0a514a] px-6 py-6 rounded-t-xl text-white shadow-md">
                <div class="flex items-center justify-between">
                    <a href="https://www.jobinandjismi.com" target="_blank" rel="noopener noreferrer">
                        <img src="https://www.jobinandjismi.com/images/secondary-logo.svg"
                            class="w-32 sm:w-32 md:w-40 lg:w-48 xl:w-56 drop-shadow-lg" alt="Jobin And Jismi Logo" />
                    </a>
                    <h6 class="text-md text-[#0a514a] sm:text-lg md:text-xl lg:text-2xl xl:text-3xl font-extrabold tracking-wide leading-tight px-4"
                        id="pageTitle">OPPORTUNITY DETAILS</h6>
                </div>
            </div>

            <div class="flex-auto px-6 lg:px-12 py-10 border border-[#0a514a] rounded-b-xl">

                <!-- Primary Information Section -->
                <section class="rounded-xl border border-[#0a514a] mb-8">
                    <h6 class="rounded-tr-xl rounded-tl-xl text-white text-lg font-bold uppercase tracking-wider bg-[#0a514a] p-3 px-6">Primary Information</h6>
                    <div class="flex flex-wrap border-[#abd334] shadow-md rounded-bl-xl rounded-br-xl pb-8">

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Title</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="title">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Company</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="company">—</div>
                        </div>

                        <div class="w-full mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Details</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="details">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Status</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="status">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Probability (%)</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="probability">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Expected Close Date</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="expectedClose">—</div>
                        </div>

                    </div>
                </section>

                <!-- Forecasting Section -->
                <section class="rounded-xl border border-[#0a514a] mb-8">
                    <h6 class="rounded-tr-xl rounded-tl-xl text-white text-lg font-bold uppercase tracking-wider bg-[#0a514a] p-3 px-6">Forecasting</h6>    
                    <div class="flex flex-wrap border-[#abd334] shadow-md rounded-bl-xl rounded-br-xl pb-8">

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Projected Total</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="projectedTotal">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Forecast Type</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="forecastType">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Range From</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="rangeFrom">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Range To</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="rangeTo">—</div>
                        </div>

                    </div>
                </section>

                <!-- Classification Section -->
                <section class="rounded-xl border border-[#0a514a] mb-8">
                    <h6 class="rounded-tr-xl rounded-tl-xl text-white text-lg font-bold uppercase tracking-wider bg-[#0a514a] p-3 px-6">Classification</h6>
                    <div class="flex flex-wrap border-[#abd334] shadow-md rounded-bl-xl rounded-br-xl pb-8">

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Subsidiary</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="subsidiary">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Department</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="department">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Class</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="class">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Location</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="location">—</div>
                        </div>

                        <div class="w-full lg:w-1/2 mt-6 px-6">
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Sales Type</label>
                            <div class="border border-[#95a2a0] px-4 py-3 bg-white rounded-lg text-sm shadow-sm w-full"
                                id="salesType">—</div>
                        </div>

                    </div>
                </section>

                <!-- Line Items Section with Tabs -->
                <section class="rounded-xl border border-[#0a514a]">
                    <h6
                        class="rounded-tr-xl rounded-tl-xl text-gray-700 text-lg font-bold uppercase tracking-wider border-b border-[#0a514a] p-3 px-6">
                        Line Level Details</h6>
                    <div class="border-[#abd334] shadow-md rounded-bl-xl rounded-br-xl p-6">

                        <!-- Tabs -->
                        <div class="flex space-x-4 mb-4 border-b border-[#0a514a]">
                            <button class="tab-btn py-2 px-4 text-gray-700 font-semibold border-b-2 border-[#0a514a]"
                                data-tab="items">Items</button>
                            <button class="tab-btn py-2 px-4 text-gray-700 font-semibold border-b-2 border-transparent"
                                data-tab="sales">Sales Team</button>
                        </div>

                        <!-- Items Tab -->
                        <div id="items" class="tab-content tab-active">
                            <div class="overflow-x-auto">
                                <table class="min-w-full border border-[#95a2a0] rounded-lg">
                                    <thead class="bg-gradient-to-r from-[#0a514a] to-[#0c6c73] text-white">
                                        <tr>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Item</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Description</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Class</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Department</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Quantity</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Rate</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody id="itemsTableBody" class="bg-white">
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Sales Team Tab -->
                        <div id="sales" class="tab-content">
                            <div class="overflow-x-auto">
                                <table class="min-w-full border border-[#95a2a0] rounded-lg">
                                    <thead class="bg-gradient-to-r from-[#0a514a] to-[#0c6c73] text-white">
                                        <tr>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Sales Role</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Employee</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Primary</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold">Contribution %</th>
                                        </tr>
                                    </thead>
                                    <tbody id="salesTeamTableBody" class="bg-white">
                                        <tr>
                                            <td colspan="4" class="px-4 py-4 text-center text-gray-500">No records to
                                                show.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </section>

            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://td3047046.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=95&deploy=1&compid=TD3047046&ns-at=AAEJ7tMQZfEmAHZ5pKgDlB14gl1ebwQScEBzoIyXL1pSYbQfpTM";

        // Tab functionality
        const tabs = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('border-[#0a514a]');
                    t.classList.add('border-transparent');
                });

                tabContents.forEach(c => c.classList.remove('tab-active'));

                tab.classList.remove('border-transparent');
                tab.classList.add('border-[#0a514a]');

                const selected = document.getElementById(tab.dataset.tab);
                selected.classList.add('tab-active');
            });
        });

        // Fetch opportunity details
        const url = new URL(window.location.href);
        const opportunityId = url.searchParams.get("opportunityId");

        if (!opportunityId) {
            alert("No Opportunity ID provided!");
        } else {
            fetch(BASE_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "getKanbanOpportunityDetails",
                    opportunityId: opportunityId
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        console.error("Failed to load opportunity details");
                        alert("Failed to load opportunity details: " + (data.message || "Unknown error"));
                        return;
                    }

                    const { header, items } = data.data;
                    console.log("Opportunity Header:", header);
                    console.log("Opportunity Items:", items);

                    // Update page title
                    document.getElementById('pageTitle').innerText = `OPPORTUNITY #${header.tranid || ""}`;

                    // Populate Primary Information
                    document.getElementById('title').innerText = header.title || "—";
                    document.getElementById('company').innerText = header.entity || "—";
                    document.getElementById('details').innerText = header.details || "—";
                    document.getElementById('status').innerText = header.status || "—";
                    document.getElementById('probability').innerText = header.probability ? header.probability + "%" : "—";
                    document.getElementById('expectedClose').innerText = header.expectedCloseDate || "—";

                    // Populate Forecasting
                    document.getElementById('projectedTotal').innerText = header.projectedTotal || "—";
                    document.getElementById('forecastType').innerText = header.forecastType || "—";
                    document.getElementById('rangeFrom').innerText = header.rangelow || "—";
                    document.getElementById('rangeTo').innerText = header.rangehigh || "—";

                    // Populate Classification
                    document.getElementById('subsidiary').innerText = header.subsidiary || "—";
                    document.getElementById('department').innerText = header.department || "—";
                    document.getElementById('class').innerText = header.class || "—";
                    document.getElementById('location').innerText = header.location || "—";
                    document.getElementById('salesType').innerText = header.salesType || "—";

                    // Populate Items table
                    const itemsTableBody = document.getElementById('itemsTableBody');
                    if (items && items.length > 0) {
                        itemsTableBody.innerHTML = '';
                        items.forEach(item => {
                            const row = document.createElement('tr');
                            row.className = 'border-t border-[#95a2a0]';
                            row.innerHTML = `
                            <td class="px-4 py-2 text-sm">${item.item || ""}</td>
                            <td class="px-4 py-2 text-sm">${item.description || ""}</td>
                            <td class="px-4 py-2 text-sm">${item.class || ""}</td>
                            <td class="px-4 py-2 text-sm">${item.department || ""}</td>
                            <td class="px-4 py-2 text-sm">${item.quantity || ""}</td>
                            <td class="px-4 py-2 text-sm">${item.rate || ""}</td>
                            <td class="px-4 py-2 text-sm">${item.amount || ""}</td>
                        `;
                            itemsTableBody.appendChild(row);
                        });
                    } else {
                        itemsTableBody.innerHTML = '<tr><td colspan="7" class="px-4 py-4 text-center text-gray-500">No items to show.</td></tr>';
                    }

                    // Populate Sales Team table
                    const salesTeamTableBody = document.getElementById('salesTeamTableBody');
                    if (header.salesTeam && header.salesTeam.length > 0) {
                        salesTeamTableBody.innerHTML = '';
                        header.salesTeam.forEach(member => {
                            const row = document.createElement('tr');
                            row.className = 'border-t border-[#95a2a0]';
                            row.innerHTML = `
                            <td class="px-4 py-2 text-sm">${member.salesRole || ""}</td>
                            <td class="px-4 py-2 text-sm">${member.employee || ""}</td>
                            <td class="px-4 py-2 text-sm">${member.isPrimary ? "Yes" : "No"}</td>
                            <td class="px-4 py-2 text-sm">${member.contribution || "0"}%</td>
                        `;
                            salesTeamTableBody.appendChild(row);
                        });
                    }

                   
                })
        }

    </script>

</body>

</html>
