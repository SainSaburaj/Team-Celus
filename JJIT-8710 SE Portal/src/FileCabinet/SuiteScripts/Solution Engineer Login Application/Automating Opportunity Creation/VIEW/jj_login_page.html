<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@10/dist/sweetalert2.min.css">
    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .left-section {
            margin-bottom: 20px;
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo img {
            max-width: 200px;
        }

        .welcome-text {
            font-size: 2em;
            color: #727171;
            margin: 0;
        }

        .welcome-text span {
            color: #71A000;
        }

        .tagline {
            font-size: 1.2em;
            color: #333;
            margin-top: 10px;
        }

        .login-box {
            background-color: #c8c9ca;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 350px;
        }

        .login-box h2 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
        }

        .login-box input[type="email"],
        .login-box input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-box h2{
            text-align: center;
        }
        .login-box button {
            background-color: #003C4C;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: calc(100% - 20px);
            font-size: 1em;
            text-transform: uppercase;
        }

        .login-box button:hover {
            background-color: #773106;
        }

        .forgot-password {
            margin-top: 10px;
            font-size: 0.9em;
            color: #007BFF;
            text-align: center;
        }

        .forgot-password a {
            color: #0e5db1;
            text-decoration: none;
        }

        @media (min-width: 769px) {
            .container {
                flex-direction: row;
                justify-content: center;
                align-items: flex-start;
                text-align: left;
            }

            .left-section {
                margin-right: 50px;
                margin-bottom: 0;
            }
        }
    </style>
</head>

<body >
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10/dist/sweetalert2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://5742736.app.netsuite.com/core/media/media.nl?id=167297&c=5742736&h=gBh6zwygkiLkCIA68tm3PhpT4MV02ofquLcxXqirnu7AJliF&_xt=.js"></script>
    <div class="container">
        <div class="left-section">
            <div class="logo">
                <img src="https://5742736.app.netsuite.com/core/media/media.nl?id=968&c=5742736&h=GxmFAAxF9p6MoYAWQBZg8tMh2Qwq2hbBP7UAe_xlvmffMv_k"
                    alt="Jobin and Jismi Logo">
            </div>
            <div class="welcome-text">
                <span>Hello,</span> Welcome!
            </div>
            <div class="tagline">
                Please log in to access your account and manage your services.
            </div>
        </div>
        <div class="login-box">
            <h2>LOGIN</h2>
                <input id="email" type="email" placeholder="Email Id" required>
                <input id="password" type="password" placeholder="Password" required>
                <button id="loginButton" type="button" onclick="login()">LOGIN</button>
            <div class="forgot-password">
                <a href="https://5742736.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=1024&deploy=1&compid=5742736&ns-at=AAEJ7tMQL9Tri5JLG_3XFKpOSabc7UkdR9r2XF1NZtmKg6MmUjY&action=forgot">Forgot your password?</a>
            </div>
        </div>
    </div>
</body>

</html>
