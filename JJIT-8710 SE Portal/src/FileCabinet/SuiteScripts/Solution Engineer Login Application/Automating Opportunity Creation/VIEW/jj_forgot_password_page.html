<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@10/dist/sweetalert2.min.css">
    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: left;
            align-items: center;
            flex-direction: column;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: left;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2em;
        }

        .logo img {
            max-width: 200px;
            margin-right: 40em;
            margin-top: 5em;
            width: 100%;
            height: auto;
        }

        .forgot-password-header {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }

        .line {
            border-top: 2px solid #003C4C;
            width: 100%;
            margin: 20px 0;
        }

        .help-text {
            font-size: 1.2em;
            color: #727171;
            margin-bottom: 20px;
        }

        .instructions {
            font-size: 1em;
            color: #333;
            margin-bottom: 20px;
        }

        .form {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .email-input {
            width: 70%;
            padding: 10px;
            margin-top: 1.5em;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            box-sizing: border-box;
        }

        .submit-button {
            margin-top: 1em;
            background-color: #003C4C;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            text-transform: uppercase;
            width: 25%;
            box-sizing: border-box;
        }

        .submit-button:hover {
            background-color: #773106;
        }

        .signup-text {
            font-size: 1em;
            color: #333;
            margin-top: 20px;
        }

        .signup-text a {
            color: #0e5db1;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .logo img {
                max-width: 120px;
                margin-right: 0;
                margin-top: 1em;
            }

            .forgot-password-header {
                font-size: 1.5em;
                text-align: center;
            }

            .line {
                width: 100%;
            }

            .help-text {
                font-size: 1.1em;
                text-align: center;
            }

            .instructions {
                font-size: 0.9em;
                text-align: center;
            }

            .form {
                flex-direction: column;
            }

            .email-input {
                width: 100%;
                padding: 8px;
                margin-bottom: 10px;
            }

            .submit-button {
                width: 100%;
                
            }
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10/dist/sweetalert2.min.js"></script>
    <script src="https://5742736.app.netsuite.com/core/media/media.nl?id=167297&c=5742736&h=gBh6zwygkiLkCIA68tm3PhpT4MV02ofquLcxXqirnu7AJliF&_xt=.js"></script>
    <div class="logo">
        <img src="https://5742736.app.netsuite.com/core/media/media.nl?id=968&c=5742736&h=GxmFAAxF9p6MoYAWQBZg8tMh2Qwq2hbBP7UAe_xlvmffMv_k"
            alt="Jobin and Jismi Logo">
    </div>
    <div class="container">
        <div class="forgot-password-header">Forgot your password?</div>
        <div class="line"></div>
        <div class="help-text">Let us help you.</div>
        <div class="instructions">Type your email id in the field below to receive your reset password link.</div>
        <div class="form">
            <input type="email" class="email-input" placeholder="Email Id" required>
            <button id="forgotSubmitButton" type="submit" class="submit-button" onclick="sendResetEmail()">Submit</button>
        </div>
    </div>
</body>

</html>
