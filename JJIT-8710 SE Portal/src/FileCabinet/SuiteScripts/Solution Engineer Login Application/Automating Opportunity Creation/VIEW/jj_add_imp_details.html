<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementation Discovery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@10/dist/sweetalert2.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap');

        body {
            background-color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
            font-weight: 500;
            text-align: center;
        }

        .line {
            border-top: 2px solid #71A000;
            width: 100%;
            margin: 20px 0;
        }

        .form-section {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .form-group {
            flex: 1 1 30%;
            min-width: 250px;
        }

        .form-group label {
            font-weight: 500;
            margin-bottom: 5px;
            display: block;
            color: #333;
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            font-family: 'Roboto', sans-serif;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-button {
            margin-top: 20px;
            background-color: #003C4C;
            color: #fff;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            text-transform: uppercase;
        }

        .submit-button:hover {
            background-color: #773106;
        }

        @media (max-width: 768px) {
            .form-group {
                flex: 1 1 100%;
            }
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo img {
            max-width: 200px;
            height: auto;
        }

        .description {
            font-size: 1em;
            color: #333;
            font-weight: 400;
            text-align: center;
        }
    </style>
</head>

<body>
      <script src="https://5742736.app.netsuite.com/core/media/media.nl?id=167297&c=5742736&h=gBh6zwygkiLkCIA68tm3PhpT4MV02ofquLcxXqirnu7AJliF&_xt=.js"></script>
     <div id="sessionExpired" style="display:none; text-align:center;">
        <h1>Session Expired</h1>
        <p>Your session has expired. Please <a
                href="https://5742736.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=1024&deploy=1&compid=5742736&ns-at=AAEJ7tMQL9Tri5JLG_3XFKpOSabc7UkdR9r2XF1NZtmKg6MmUjY">log
                in</a> again.</p>
    </div>
    <div  id="mainContainer" class="main-container">
        <div class="logo">
            <img src="https://5742736.app.netsuite.com/core/media/media.nl?id=968&c=5742736&h=GxmFAAxF9p6MoYAWQBZg8tMh2Qwq2hbBP7UAe_xlvmffMv_k" alt="Jobin and Jismi Logo">
        </div>
        <div class="description">IMPLEMENTATION DISCOVERY FORM</div>
        <!-- <div class="header">Implementation Discovery Details</div> -->
        <div class="line"></div>

        <form id="discoveryForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="leadList">Lead List</label>
                    <select id="customer" name="leadList">
                       
                    </select>
                </div>

                <div class="form-group">
                    <label for="coreProcesses">Core Processes</label>
                    <textarea id="coreProcesses" name="coreProcesses"></textarea>
                </div>

                <div class="form-group">
                    <label for="processPainPoints">Process Pain Points</label>
                    <textarea id="processPainPoints" name="processPainPoints"></textarea>
                </div>

                <div class="form-group">
                    <label for="departmentNeeds">Department-Specific Needs</label>
                    <textarea id="departmentNeeds" name="departmentNeeds"></textarea>
                </div>

                <div class="form-group">
                    <label for="customizationRequests">Customization Requests</label>
                    <textarea id="customizationRequests" name="customizationRequests"></textarea>
                </div>

                <div class="form-group">
                    <label for="dataMigration">Data Migration</label>
                    <textarea id="dataMigration" name="dataMigration"></textarea>
                </div>

                <div class="form-group">
                    <label for="integrationNeeds">Integration Needs</label>
                    <textarea id="integrationNeeds" name="integrationNeeds"></textarea>
                </div>

                <div class="form-group">
                    <label for="userRoles">User Roles & Permissions</label>
                    <textarea id="userRoles" name="userRoles"></textarea>
                </div>

                <div class="form-group">
                    <label for="reportingRequirements">Reporting Requirements</label>
                    <textarea id="reportingRequirements" name="reportingRequirements"></textarea>
                </div>

                <div class="form-group">
                    <label for="workflowRequirements">Workflow Requirements</label>
                    <textarea id="workflowRequirements" name="workflowRequirements"></textarea>
                </div>

                <div class="form-group">
                    <label for="complianceRequirements">Compliance Requirements</label>
                    <textarea id="complianceRequirements" name="complianceRequirements"></textarea>
                </div>

                <div class="form-group">
                    <label for="futureNeeds">Future Needs</label>
                    <textarea id="futureNeeds" name="futureNeeds"></textarea>
                </div>
            </div>

           <button type="button" onclick="insertLeadData()" class="submit-button">Submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <script>
        document.getElementById("discoveryForm").addEventListener("submit", function (e) {
            e.preventDefault();
            Swal.fire({
                icon: 'success',
                title: 'Record Updated Successfully',
                text: 'The lead record has been updated with the implementation details.'
            });
        });
    </script>
</body>

</html>
