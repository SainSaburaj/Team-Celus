<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetSuite Sales Pipeline Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    /* Define CSS variables for theming */
    :root {
      --bg-primary: #1a202c;
      --bg-secondary: #2d3748;
      --bg-tertiary: #4a5568;
      --bg-card: #4a5568;
      --text-primary: #edf2f7;
      --text-secondary: #a0aec0;
      --accent-primary: #2b6cb0;
      --accent-opportunity: #3182ce;
      --accent-estimate: #d69e2e;
      --accent-salesorder: #38a169;
      --accent-opportunity-sec: #63b3ed;
      --accent-estimate-sec: #ecc94b;
      --accent-salesorder-sec: #68d391;
      --border-primary: #4a5568;
      --stats-opp-bg: linear-gradient(135deg, #2262a7, #2576c2);
      --stats-est-bg: linear-gradient(135deg, #b7791f, #d69e2e);
      --stats-so-bg: linear-gradient(135deg, #2f855a, #38a169);
      --bg-main: #1a202c;
    }

    [data-theme="light"] {
      --bg-primary: #f7fafc;
      --bg-secondary: #edf2f7;
      --bg-tertiary: #e2e8f0;
      --bg-card: #ffffff;
      --text-primary: #1a202c;
      --text-secondary: #4a5568;
      --accent-primary: #2b6cb0;
      --accent-opportunity: #3182ce;
      --accent-estimate: #d69e2e;
      --accent-salesorder: #38a169;
      --border-primary: #e2e8f0;
      --stats-opp-bg: linear-gradient(135deg, #63b3ed, #90cdf4);
      --stats-est-bg: linear-gradient(135deg, #ecc94b, #f6e05e);
      --stats-so-bg: linear-gradient(135deg, #68d391, #9ae6b4);
      --bg-main: #f7fafc;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
    }

    .main-content {
      background: var(--bg-main);
      position: relative;
    }

    .main-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      opacity: 0.5;
      z-index: -1;
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
      gap: 1.5rem;
      padding: 1.5rem;
      overflow-x: auto;
      flex: 1;
    }

    .kanban-column {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      min-width: 20rem;
      max-width: 26rem;
      max-height: calc(100vh - 12rem);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--bg-primary);
      background-color: var(--bg-secondary);
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .kanban-column::-webkit-scrollbar {
      width: 6px;
    }

    .kanban-column::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-radius: 4px;
    }

    .kanban-column::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 4px;
    }

    .kanban-column:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .kanban-column.opportunity h3 {
      background: var(--stats-opp-bg);
      padding: 0.5rem;
      border-radius: 0.5rem 0.5rem 0 0;
    }

    .kanban-column.estimate h3 {
      background: var(--stats-est-bg);
      padding: 0.5rem;
      border-radius: 0.5rem 0.5rem 0 0;
    }

    .kanban-column.salesorder h3 {
      background: var(--stats-so-bg);
      padding: 0.5rem;
      border-radius: 0.5rem 0.5rem 0 0;
    }

    .kanban-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-left-width 0.2s ease, background-color 0.2s ease;
      background-color: var(--bg-card);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      border: 1px solid var(--border-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
      cursor: grab;
    }

    .kanban-card.opportunity {
      border: 0.6px solid var(--accent-opportunity-sec);
    }

    .kanban-card.estimate {
      border: 0.5px solid var(--accent-estimate-sec);
    }

    .kanban-card.salesorder {
      border: 0.5px solid var(--accent-salesorder-sec);
    }

    .kanban-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      border-left-width: 7px;
      background-color: var(--bg-tertiary);
    }

    .kanban-card:active {
      transform: scale(0.98);
      transition: transform 0.1s ease;
    }

    .kanban-card.dragging {
      opacity: 0.8;
      transform: rotate(2deg);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .kanban-card:focus {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .kanban-card .card-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-primary);
    }

    .kanban-card .card-desc {
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .kanban-card .card-date {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-secondary);
      opacity: 0.8;
    }

    .kanban-card.collapsed {
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      background-color: var(--bg-secondary);
    }

    .kanban-card.collapsed .card-desc,
    .kanban-card.collapsed .card-date {
      display: none;
    }

    .kanban-card::before {
      content: '';
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-primary);
      opacity: 0.7;
    }

    .kanban-card.opportunity::before {
      background-color: var(--accent-opportunity);
    }

    .kanban-card.estimate::before {
      background-color: var(--accent-estimate);
    }

    .kanban-card.salesorder::before {
      background-color: var(--accent-salesorder);
    }

    .kanban-card:focus-visible {
      outline: 2px solid var(--accent-opportunity);
      outline-offset: 2px;
    }

    .kanban-card .card-status {
      color: var(--bg-primary);
      position: absolute;
      font-size: 0.75rem;
      width: auto;
      border-radius: 0.5rem;
      display: inline-block;
      right: 0.75rem;
      top: 0.75rem;
    }

    .card-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      max-width: 195px;
    }

    @media (max-width: 768px) {
      .kanban-card {
        padding: 1rem;
        margin-bottom: 1rem;
      }

      .kanban-card .card-title {
        font-size: 0.95rem;
      }

      .kanban-card .card-desc {
        font-size: 0.8rem;
      }

      .kanban-card .card-date {
        font-size: 0.7rem;
      }

      .custom-svg-container {
        display: none !important;
      }

      #oppCount,
      #oppTotal,
      #estCount,
      #estTotal,
      #soCount,
      #soTotal {
        font-size: 0.75rem !important;
      }

      .stats-card .text-m {
        font-size: 0.75rem !important;
      }

      .stats-card .text-l {
        font-size: 0.85rem !important;
      }

      .sidebar {
        position: fixed;
        top: 4rem;
        /* below the topbar */
        left: 0;
        width: 16rem;
        height: calc(100vh - 4rem);
        background-color: var(--bg-secondary);
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .sidebar.show {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0 !important;
      }
    }

    .kanban-column.drag-over {
      background-color: var(--bg-tertiary);
      transform: scale(1.02);
    }

    .stats-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border-radius: 0.45rem;
      cursor: pointer;
    }

    .stats-card.opportunity {
      background: var(--stats-opp-bg);
    }

    .stats-card.estimate {
      background: var(--stats-est-bg);
    }

    .stats-card.salesorder {
      background: var(--stats-so-bg);
    }

    .stats-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    .custom-svg-container.opportunity {
      position: relative;
      width: 50px;
      height: 50px;
      background-color: #C8E5FC;
      color: var(--accent-opportunity-sec);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .custom-svg-icon.opportunity {
      position: relative;
      user-select: none;
      width: 34px;
      height: 34px;
      display: block;
      margin: auto;
      fill: currentColor;
      flex-shrink: 0;
      font-size: 24px;
      transform: rotate(45deg);
      transition: fill 200ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;
    }

    .custom-svg-container.estimate {
      position: relative;
      width: 50px;
      height: 50px;
      background-color: #FFF2BE;
      color: var(--accent-estimate-sec);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .custom-svg-icon.estimate {
      position: relative;
      user-select: none;
      width: 34px;
      height: 34px;
      display: block;
      margin: auto;
      fill: currentColor;
      flex-shrink: 0;
      font-size: 24px;
      transition: fill 200ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;
    }

    .custom-svg-container.salesorder {
      position: relative;
      width: 50px;
      height: 50px;
      background-color: #c1fdd6;
      color: var(--accent-salesorder-sec);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .custom-svg-icon.salesorder {
      position: relative;
      user-select: none;
      width: 34px;
      height: 34px;
      display: block;
      margin: auto;
      fill: currentColor;
      flex-shrink: 0;
      font-size: 24px;
      transition: fill 200ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;
    }

    .stats-card {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 1rem;
    }

    .stats-card .icon-text {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 100%;
      height: 90px;
    }

    .stats-card .icon-text svg {
      margin-right: 8px;
    }

    .quick-actions {
      transition: background-color 0.2s ease, transform 0.2s ease;
      color: var(--text-primary);
      border-radius: 0.5rem;
    }

    .quick-actions:hover {
      background-color: var(--bg-tertiary);
      transform: translateX(4px);
    }

    .collapse-toggle-opportunity {
      transition: transform 0.2s ease;
      background-color: var(--accent-opportunity-sec);
      color: var(--text-primary);
      border-radius: 50%;
    }

    .collapse-toggle-opportunity:hover {
      transform: scale(1.1);
      background-color: #4eabed;
    }

    .collapse-toggle-estimate {
      transition: transform 0.2s ease;
      background-color: var(--accent-estimate-sec);
      color: var(--text-primary);
      border-radius: 50%;
    }

    .collapse-toggle-estimate:hover {
      transform: scale(1.1);
      background-color: #e9c237;
    }

    .collapse-toggle-salesorder {
      transition: transform 0.2s ease;
      background-color: var(--accent-salesorder-sec);
      color: var(--text-primary);
      border-radius: 50%;
    }

    .collapse-toggle-salesorder:hover {
      transform: scale(1.1);
      background-color: #47d37d;
    }

    .sidebar {
      transition: transform 0.3s ease;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-primary);
    }

    .sidebar.hidden {
      transform: translateX(-100%);
    }

    .main-content {
      transition: margin-left 0.3s ease;
    }

    .main-content.full-width {
      margin-left: 0;
    }

    .toggle-btn,
    .theme-toggle {
      transition: transform 0.3s ease;
      background-color: var(--accent-primary);
      color: white;
      border-radius: 50%;
    }

    .toggle-btn:hover,
    .theme-toggle:hover {
      transform: scale(1.1);
      background-color: var(--accent-opportunity);
    }

    .theme-toggle::before {
      content: '☾';
    }

    .theme-toggle.active::before {
      content: '☀';
    }

    .modal-overlay {
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal {
      background-color: var(--bg-secondary);
      border-radius: 0.75rem;
    }

    .modal input,
    .modal textarea {
      background-color: var(--bg-card);
      border: 1px solid var(--border-primary);
      color: var(--text-primary);
      border-radius: 0.5rem;
    }

    .modal input:focus,
    .modal textarea:focus {
      border-color: var(--accent-primary);
      outline: none;
      box-shadow: 0 0 0 2px var(--accent-opportunity);
    }

    .kanban-board::-webkit-scrollbar {
      height: 8px;
    }

    .kanban-board::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-radius: 4px;
    }

    .kanban-board::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 4px;
    }

    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .loader-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent-primary), transparent);
      animation: spin 1s linear infinite;
      position: relative;
    }

    .loader-spinner::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      bottom: 5px;
      background: var(--bg-secondary);
      border-radius: 50%;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 500;
    }

    .alert-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .alert-modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .alert-modal {
      background: var(--bg-card);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .alert-modal-overlay.show .alert-modal {
      transform: scale(1);
    }

    .alert-icon {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-estimate), #f56565);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.5rem;
      color: white;
    }

    .alert-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
      color: var(--text-primary);
    }

    .alert-message {
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .alert-close {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent-primary);
      color: var(--text-primary);
      border: none;
      border-radius: 0.5rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .alert-close:hover {
      background: var(--accent-opportunity);
    }

    .filter-container {
      gap: 0.5rem;
      align-items: left;
      width: 80%;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .filter-container input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.5);
      opacity: 0.8;
    }

    .filter-dropdown,
    .filter-input {
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--border-primary);
      border-radius: 4px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: smaller;
      width: 100%;
    }

    .apply-filter-btn {
      background-color: var(--accent-primary);
      color: white;
      border-radius: 0.5rem;
    }

    .apply-filter-btn:hover {
      background-color: var(--accent-opportunity);
    }

    #oppCount,
    #oppTotal,
    #estCount,
    #estTotal,
    #soCount,
    #soTotal {
      color: var(--text-primary);
    }

    [data-theme="light"] #oppCount,
    [data-theme="light"] #oppTotal {
      color: var(--accent-opportunity);
    }

    [data-theme="light"] #estCount,
    [data-theme="light"] #estTotal {
      color: var(--accent-estimate);
    }

    [data-theme="light"] #soCount,
    [data-theme="light"] #soTotal {
      color: var(--accent-salesorder);
    }
  </style>
</head>

      </div>
      <!-- Stats Row -->
      <div class="p-4 grid grid-cols-3 gap-4"
        style="background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-primary);">
        <div class="stats-card opportunity p-4 text-center" style="position: relative;"
          onclick="filterByStage('opportunity')">
          <div class="icon-text">
            <div class="custom-svg-container opportunity">
              <svg class="custom-svg-icon opportunity" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path fill-rule="evenodd"
                  d="M3 3v8h8V3zm6 6H5V5h4zm-6 4v8h8v-8zm6 6H5v-4h4zm4-16v8h8V3zm6 6h-4V5h4zm-6 4v8h8v-8zm6 6h-4v-4h4z">
                </path>
              </svg>
            </div>
            <div style="position: absolute; text-align: right; right: 0.75rem;">
              <div class="text-2xl font-bold" id="oppCount" style="right: 0.75rem;"></div>
              <div class="text-m" style="color: var(--text-primary); right: 0.75rem; line-height: 2rem;">Opportunities
              </div>
              <div class="text-l font-bold" id="oppTotal" style="right: 0.75rem;"></div>
            </div>
          </div>
        </div>
        <div class="stats-card estimate p-4 text-center" style="position: relative;"
          onclick="filterByStage('estimate')">
          <div class="icon-text">
            <div class="custom-svg-container estimate">
              <svg class="custom-svg-icon estimate" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path fill-rule="evenodd"
                  d="m16.66 4.52 2.83 2.83-2.83 2.83-2.83-2.83zM9 5v4H5V5zm10 10v4h-4v-4zM9 15v4H5v-4zm7.66-13.31L11 7.34 16.66 13l5.66-5.66zM11 3H3v8h8zm10 10h-8v8h8zm-10 0H3v8h8z">
                </path>
              </svg>
            </div>
            <div style="position: absolute; text-align: right; right: 0.75rem;">
              <div class="text-2xl font-bold" id="estCount" style="right: 0.75rem;"></div>
              <div class="text-m" style="color: var(--text-primary); line-height: 2rem;">Estimates</div>
              <div class="text-l font-bold" id="estTotal" style="right: 0.75rem;"></div>
            </div>
          </div>
        </div>
        <div class="stats-card salesorder p-4 text-center" style="position: relative;"
          onclick="filterByStage('salesorder')">
          <div class="icon-text">
            <div class="custom-svg-container salesorder"
              style="background-color: #c1fdd6; color: var(--accent-salesorder-sec);">
              <svg class="custom-svg-icon salesorder" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path
                  d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2M4 9h10.5v3.5H4zm0 5.5h10.5V18H4zM20 18h-3.5V9H20z">
                </path>
              </svg>
            </div>
            <div style="position: absolute; text-align: right; right: 0.75rem;">
              <div class="text-2xl font-bold" id="soCount"></div>
              <div class="text-m" style="color: var(--text-primary); line-height: 2rem;">Sales Orders</div>
              <div class="text-l font-bold" id="soTotal"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- Kanban Board -->
      <div class="kanban-board">
        <div class="kanban-column opportunity p-4" id="opportunity-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-sm font-semibold tracking-wide" style="color: var(--text-primary);">Opportunity <span
                style="color: var(--accent-opportunity);" class="text-xs"></span></h3>
            <button class="collapse-toggle-opportunity text-xs rounded-full w-6 h-6 flex items-center justify-center"
              onclick="toggleCollapse('opportunity')">−</button>
          </div>
        </div>
        <div class="kanban-column estimate p-4" id="estimate-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-sm font-semibold tracking-wide" style="color: var(--text-primary);">Estimate <span
                style="color: var(--accent-estimate);" class="text-xs"></span></h3>
            <button class="collapse-toggle-estimate text-xs rounded-full w-6 h-6 flex items-center justify-center"
              onclick="toggleCollapse('estimate')">−</button>
          </div>
        </div>
        <div class="kanban-column salesorder p-4" id="salesorder-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-sm font-semibold tracking-wide" style="color: var(--text-primary);">Sales Order <span
                style="color: var(--accent-salesorder);" class="text-xs"></span></h3>
            <button class="collapse-toggle-salesorder text-xs rounded-full w-6 h-6 flex items-center justify-center"
              onclick="toggleCollapse('salesorder')">−</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Add Card Modal -->
  <div class="modal-overlay fixed inset-0 hidden items-center justify-center z-50" id="addCardModal">
    <div class="modal p-6 w-full max-w-md shadow-lg">
      <h3 class="text-lg font-semibold text-center mb-4" style="color: var(--text-primary);">Add New <span
          id="modalTitle"></span></h3>
      <form id="addCardForm">
        <input type="hidden" id="cardStage" />
        <label class="block text-sm font-medium mb-1" style="color: var(--text-secondary);">Title</label>
        <input type="text" id="cardTitle" class="w-full p-2 mb-3" required />
        <label class="block text-sm font-medium mb-1" style="color: var(--text-secondary);">Description</label>
        <textarea id="cardDesc" class="w-full p-2 mb-3" rows="3"></textarea>
        <div class="flex justify-end gap-3">
          <button type="button" class="px-4 py-2 transition"
            style="background-color: var(--bg-tertiary); color: var(--text-secondary);"
            onmouseover="this.style.backgroundColor='var(--bg-secondary)'"
            onmouseout="this.style.backgroundColor='var(--bg-tertiary)'">Cancel</button>
          <button type="submit" class="px-4 py-2 transition"
            style="background-color: var(--accent-primary); color: var(--text-primary);"
            onmouseover="this.style.backgroundColor='var(--accent-opportunity)'"
            onmouseout="this.style.backgroundColor='var(--accent-primary)'">Add</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Modern Global Loader -->
  <div class="loader-overlay" id="globalLoader">
    <div class="loader-container">
      <div class="loader-spinner"></div>
      <div class="loader-text">This may take a moment. Please wait…</div>
    </div>
  </div>
  <!-- Modern Alert Modal -->
  <div class="alert-modal-overlay" id="alertModal">
    <div class="alert-modal">
      <div class="alert-icon">⚠️</div>
      <div class="alert-title" id="alertTitle">Error</div>
      <div class="alert-message" id="alertMessage"></div>
      <button class="alert-close" onclick="closeAlert()">OK</button>
    </div>
  </div>
  </div>
  
  <script>
    // Initialize Kanban Board - all business logic moved to jj_front_end_actions.js
    $(document).ready(function () {
      $('#filterToggleBtn').on('click', function () {
        const $filterSection = $('#filterSection');
        const $icon = $(this).find('span');

        $filterSection.slideToggle(300, function () {
          // Toggle icon after animation completes
          if ($filterSection.is(':visible')) {
            $icon.text('➖');
          } else {
            $icon.text('➕');
          }
        });
      });

      // Initialize dashboard and handlers
      initDashboard();
      initKanbanDragDrop();
      initAddCardForm();
      initFilterButton();
    });
