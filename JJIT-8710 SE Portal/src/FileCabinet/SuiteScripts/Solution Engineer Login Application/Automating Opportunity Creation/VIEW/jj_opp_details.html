<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Edit Opportunity Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <style>
        body {
            padding: 20px;
            font-family: 'Montserrat', sans-serif;
            background-color: #f9f9f9;
        }

        .main-container {
            padding-bottom: 80px;
            
            /* ensures space for the sticky footer */
        }

        header {
            background-color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            header {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        .logo {
            height: 45px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            font-weight: 600;
            color: #444;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        nav ul li a:hover {
            background-color: #f0f0f0;
        }

        .item-box {
            background: #fff;
           
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-radius: 6px;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 20px;
            width: 100%;
            background: #ffffff;
            padding: 10px 20px;
            box-shadow: 0 -1px 5px rgba(0, 0, 0, 0.1);
            text-align: right;
            z-index: 1000;
        }

        @media (min-width: 768px) {
            .item-box {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
            }
        }

        .item-section {
            flex: 1;
            padding: 5px;
            min-width: 150px;
        }

        .item-section input,
        .item-section textarea {
            width: 100%;
            box-sizing: border-box;
        }

        .btn-save {
            background-color: #0a514a;
            color: white;

            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            margin-right: 20px;
        }

        .btn-danger {
            background-color: red;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10/dist/sweetalert2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script
        src="https://5742736.app.netsuite.com/core/media/media.nl?id=167297&c=5742736&h=gBh6zwygkiLkCIA68tm3PhpT4MV02ofquLcxXqirnu7AJliF&_xt=.js"></script>

    <div id="sessionExpired" style="display:none; text-align:center;">
        <h1>Session Expired</h1>
        <p>Your session has expired. Please <a href="https://5742736.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=1024&deploy=1&compid=5742736&ns-at=AAEJ7tMQL9Tri5JLG_3XFKpOSabc7UkdR9r2XF1NZtmKg6MmUjY">log in</a> again.</p>
    </div>

    <div class="main-container" id="mainContainer">
        <header>
            <div class="logo-container">
                <img src="https://5742736.app.netsuite.com/core/media/media.nl?id=968&c=5742736&h=GxmFAAxF9p6MoYAWQBZg8tMh2Qwq2hbBP7UAe_xlvmffMv_k"
                    alt="Jobin and Jismi" class="logo" />
            </div>
            <nav>
                <ul>
                    <li><a href="jj_home_page.html">Home</a></li>
                    <li><a href="jj_order_history_page.html">Upload</a></li>
                    <li><a href="jj_login_page.html">Logout</a></li>
                </ul>
            </nav>
        </header>

        <input type="hidden" id="tranId" />
        <input type="hidden" id="internalId" />

        <div id="lineItemsContainer">
          
        </div>

        <button onclick="addNewLine()">+ Add new line</button>
        <footer class="footer">
            <button class="btn-save" onclick="saveLineItems()">Save Changes</button>
        </footer>

    </div>
</body>

</html>
